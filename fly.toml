# fly.toml app configuration file generated for trade-master-bot on 2026-09-22T18:43:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "trade-master-bot"
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[restart]]
  policy = 'always'
  processes = ['app']
  retries = 500
